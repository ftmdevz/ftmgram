<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
  <defs>
    <linearGradient id="mtprotoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>

    <linearGradient id="httpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="100%" height="100%" fill="#0d1117" rx="12" />

  <!-- FLOW 1: FTMGram Direct MTProto -->
  <g transform="translate(40, 40)">
    <text x="0" y="20" fill="#f97316" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">1. FTMGram (Direct MTProto Protocol)</text>
    
    <!-- Client Box -->
    <rect x="0" y="35" width="160" height="60" rx="8" fill="#161b22" stroke="#ff5722" stroke-width="2" filter="url(#shadow)" />
    <text x="80" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FTMGram Client</text>
    <text x="80" y="82" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">(User / Bot)</text>

    <!-- Arrow -->
    <line x1="165" y1="65" x2="485" y2="65" stroke="url(#mtprotoGrad)" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="485,60 495,65 485,70" fill="#ff9800" />
    <text x="325" y="55" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Direct Encrypted MTProto (TCP/WebSocket)</text>

    <!-- Telegram Server Box -->
    <rect x="500" y="35" width="180" height="60" rx="8" fill="#161b22" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
    <text x="590" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Telegram MTProto</text>
    <text x="590" y="82" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Core Server DCs</text>
  </g>

  <!-- FLOW 2: Standard Bot API (Intermediary) -->
  <g transform="translate(40, 170)">
    <text x="0" y="20" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">2. Official HTTP Bot API (Slow Intermediate Server)</text>
    
    <!-- Bot Box -->
    <rect x="0" y="35" width="160" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <text x="80" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">HTTP Bot Script</text>

    <!-- Arrow 1 -->
    <line x1="165" y1="65" x2="245" y2="65" stroke="#3b82f6" stroke-width="2" />
    <polygon points="245,61 255,65 245,69" fill="#3b82f6" />
    <text x="205" y="55" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">HTTPS JSON</text>

    <!-- Intermediate Server Box -->
    <rect x="260" y="35" width="170" height="60" rx="8" fill="#161b22" stroke="#3b82f6" stroke-width="1.5" />
    <text x="345" y="65" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Bot API Gateway</text>
    <text x="345" y="82" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">(Intermediate Proxy)</text>

    <!-- Arrow 2 -->
    <line x1="435" y1="65" x2="485" y2="65" stroke="#3b82f6" stroke-width="2" />
    <polygon points="485,61 495,65 485,69" fill="#3b82f6" />
    <text x="460" y="55" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">MTProto</text>

    <!-- Telegram Server Box -->
    <rect x="500" y="35" width="180" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <text x="590" y="65" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Telegram MTProto</text>
    <text x="590" y="82" fill="#8b949e" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Core Server DCs</text>
  </g>
</svg>
