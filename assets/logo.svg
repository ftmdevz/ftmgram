<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181310" />
      <stop offset="50%" stop-color="#24140a" />
      <stop offset="100%" stop-color="#0e0a07" />
    </linearGradient>

    <!-- Flame / Lightning Glow Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="50%" stop-color="#ff4500" />
      <stop offset="100%" stop-color="#ff1a00" />
    </linearGradient>

    <!-- Plane Shading Gradient -->
    <linearGradient id="planeGrad" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ffe2d1" />
      <stop offset="100%" stop-color="#ff9e70" />
    </linearGradient>

    <!-- Wing Shadow -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e64a00" />
      <stop offset="100%" stop-color="#801a00" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Glowing Orange Border -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="8" />
  
  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.35" filter="url(#glow)" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ff8c00" stroke-width="2" opacity="0.2" />

  <!-- Quantum / Speed Lightning Trails -->
  <path d="M120 310 L210 270 L150 250 L270 190" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" filter="url(#glow)" />

  <!-- Telegram Iconic Paper Plane (Futuristic FTM Styled) -->
  <g filter="url(#softGlow)">
    <!-- Right Wing & Main Body -->
    <path d="M128 260 L388 140 L330 364 L246 292 Z" fill="url(#planeGrad)" />
    
    <!-- Left Under-Fold Wing -->
    <path d="M128 260 L388 140 L246 292 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- Wing Shadow / Keel -->
    <path d="M246 292 L230 356 L278 318 Z" fill="url(#shadowGrad)" />
  </g>

  <!-- Speed Energy Sparks -->
  <circle cx="395" cy="135" r="8" fill="#ffffff" filter="url(#glow)" />
  <circle cx="330" cy="370" r="5" fill="#ff7a00" filter="url(#glow)" />
  <circle cx="120" cy="265" r="6" fill="#ff4500" filter="url(#glow)" />

  <!-- FTM Branding Monogram Text -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="6">FTMGRAM</text>
</svg>
