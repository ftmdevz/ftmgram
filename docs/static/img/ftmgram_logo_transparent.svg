<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <!-- Vibrant Flame / Energy Gradient -->
    <linearGradient id="ftmFlame" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#ff3b00" />
      <stop offset="50%" stop-color="#ff7300" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>

    <linearGradient id="ftmCore" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe8d6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
  </defs>

  <!-- Left Icon: Modern Sleek Telegram Flame / Energy Plane -->
  <g transform="translate(10, 10)">
    <!-- Outer Flame -->
    <path d="M 50 5 C 65 30 85 45 85 70 C 85 92 68 100 50 100 C 32 100 15 92 15 70 C 15 48 35 25 50 5 Z" fill="url(#ftmFlame)" />
    
    <!-- Inner Energy Plane Wing -->
    <path d="M 50 25 C 58 42 70 54 70 70 C 70 82 60 88 50 88 C 40 88 30 82 30 70 C 30 55 42 38 50 25 Z" fill="url(#ftmCore)" opacity="0.9" />

    <!-- Center Dynamic Cut / Thrust -->
    <path d="M 50 40 L 62 72 L 50 64 L 38 72 Z" fill="#ff4d00" />
  </g>

  <!-- Right Typography: "FTMGram" (Pure Clean, Exactly like Pyrogram Docs) -->
  <text x="125" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5px">FTMGram</text>
</svg>
